name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug creates an immediately installable APK)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build Android APK (${{ inputs.build_type || 'debug' }})
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: ⚙️ Write Production Environment Variables
        run: |
          echo "EXPO_PUBLIC_API_URL=https://schoolsarthiapp.com/api/v1" > app/.env
          echo "EXPO_PUBLIC_API_URL=https://schoolsarthiapp.com/api/v1" > app/.env.local
          cat app/.env

      - name: 📦 Install NPM dependencies
        working-directory: ./app
        run: npm install --legacy-peer-deps

      - name: 🔨 Expo Prebuild (Generate Android native project)
        working-directory: ./app
        env:
          EXPO_PUBLIC_API_URL: https://schoolsarthiapp.com/api/v1
        run: npx expo prebuild --platform android --clean --no-install

      - name: 🚀 Build APK with Gradle
        working-directory: ./app/android
        env:
          EXPO_PUBLIC_API_URL: https://schoolsarthiapp.com/api/v1
        run: |
          chmod +x gradlew
          if [ "${{ inputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: 📂 Find and Prepare APK for Download
        run: |
          mkdir -p output-apk
          APK_FILE=$(find app/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            echo "Found APK: $APK_FILE"
            cp "$APK_FILE" output-apk/SchoolCRM.apk
          else
            echo "No APK found!"
            find app/android/app/build/outputs -type f || true
            exit 1
          fi

      - name: 📲 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SchoolCRM-APK
          path: output-apk/SchoolCRM.apk
          retention-days: 14
